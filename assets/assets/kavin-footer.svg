<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="180" viewBox="0 0 1000 180">

<defs>
  <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#10070C"/>
    <stop offset="50%" stop-color="#701A3D"/>
    <stop offset="100%" stop-color="#10070C"/>
  </linearGradient>
</defs>

<rect width="1000" height="180" rx="20" fill="url(#footer)"/>

<path d="M0 90 Q250 20 500 90 T1000 90"
      fill="none" stroke="#E5B5C7" stroke-width="2">

  <animate attributeName="d"
    values="M0 90 Q250 20 500 90 T1000 90;
            M0 90 Q250 160 500 90 T1000 90;
            M0 90 Q250 20 500 90 T1000 90"
    dur="5s" repeatCount="indefinite"/>

</path>

<text x="500" y="85"
      text-anchor="middle"
      fill="#F8F0F3"
      font-family="Arial"
      font-size="30"
      font-weight="bold">

  THANKS FOR VISITING!

</text>

<text x="500" y="120"
      text-anchor="middle"
      fill="#E5B5C7"
      font-family="Arial"
      font-size="17">

  Keep Learning • Keep Building • Keep Innovating

</text>

</svg>
