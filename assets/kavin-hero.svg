<svg width="1000" height="300" viewBox="0 0 1000 300"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#10070C"/>
    <stop offset="50%" stop-color="#451126"/>
    <stop offset="100%" stop-color="#190B12"/>
  </linearGradient>

  <linearGradient id="text" x1="0" x2="1">
    <stop offset="0%" stop-color="#F8F0F3"/>
    <stop offset="100%" stop-color="#C77B9B"/>
  </linearGradient>
</defs>

<rect width="1000" height="300" rx="20" fill="url(#bg)"/>

<g opacity=".15" stroke="#C77B9B">
  <path d="M0 50 H1000 M0 100 H1000 M0 150 H1000 M0 200 H1000 M0 250 H1000"/>
  <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300"/>
</g>

<circle cx="850" cy="90" r="55" fill="none" stroke="#C77B9B" opacity=".5">
  <animate attributeName="r" values="45;65;45" dur="5s" repeatCount="indefinite"/>
</circle>

<text x="500" y="115" text-anchor="middle"
font-family="Arial" font-size="52" font-weight="bold"
fill="url(#text)">KAVIN</text>

<text x="500" y="165" text-anchor="middle"
font-family="Arial" font-size="23" fill="#F8F0F3">
AI ENGINEER | DEVELOPER | CSE STUDENT
</text>

<path d="M250 195 H750" stroke="#C77B9B" stroke-width="2">
  <animate attributeName="stroke-dasharray"
  values="0,500;500,0" dur="4s" repeatCount="indefinite"/>
</path>

<text x="500" y="240" text-anchor="middle"
font-family="Arial" font-size="17" fill="#E5B5C7">
Building Intelligent Solutions • Learning • Innovating
</text>

</svg>
